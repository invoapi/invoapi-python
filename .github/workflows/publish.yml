name: Publish to PyPI

# A GitHub release publishes the package. PyPI trusts this workflow directly
# (Trusted Publishing), so no API token is stored anywhere.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install build pytest && pip install -e .
      - run: pytest -m "not integration"
      - name: Tag matches package version
        run: test "v$(python -c 'import invoapi; print(invoapi.__version__)')" = "${GITHUB_REF_NAME}"
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/invoapi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
